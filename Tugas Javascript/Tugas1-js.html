<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Luas Bangun Datar</title>
</head>
<body>
    <h1 style="text-align:center; font-style: italic; color: blue;">MENGHITUNG LUAS BANGUN DATAR</h1>
    <script>
        document.write("<hr>");     //untuk membuat garis horizontal sebagai pemisah

        //menghitung luas persegi panjang
        let panjang = 10;   //panjang dari persegi panjang
        let tinggi = 8;   //tinggi dari persegi panjang
        let luaspersegiPanjang = panjang * tinggi;      //rumus untuk menghitung luas persegi panjang

        document.write(" Luas Persegi Panjang: " + luaspersegiPanjang + "<br>");         //untuk menampilkan output dari rumus luas persegi panjang

        document.write("<hr>");     //untuk membuat garis horizontal sebagai pemisah

        
        //menghitung luas bujur sangkar
        let Sisi = 8;   //sisi dari bujur sangkar
        let luasbujurSangkar = Sisi * Sisi;      //rumus untuk menghitung luas bujur sangkar
        document.write(' Luas Bujur sangkar: ' + luasbujurSangkar + "<br>");     //untuk menampilkan output dari rumus luas bujur sangkar

        document.write("<hr>");     //untuk membuat garis horizontal sebagai pemisah

        //menghitung luas segitiga
        const pengali = 0.5;   //konstanta untuk menghitung luas segitiga
        let alas = 10;   //alas dari segitiga
        let tinggiSegitiga = 8;   //tinggi dari segitiga
        let Luassegitiga = pengali * alas * tinggiSegitiga;         //rumus untuk menghitung luas segitiga
        document.write(' Luas Segitiga: ' + Luassegitiga + "<br>");        //untuk menampilkan output dari rumus luas segitiga

        document.write("<hr>");     //untuk membuat garis horizontal sebagai pemisah

    </script>
</body>
</html>
